name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loja
          POSTGRES_PASSWORD: loja
          POSTGRES_DB: loja
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loja" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://loja:loja@localhost:5432/loja
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm run vendor && npm run build:css
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_ALLOWED_HOSTS: example.com
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test tests --verbosity 2
